<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>MoneyTree</title>

<!-- Add-to-Home-Screen behavior on iPad Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoneyTree">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7a5a">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script src="data/companies.js"></script>
<script src="data/market-provider.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        /* offline app-shell caching is a nice-to-have, not required */
      });
    });
  }
</script>
</body>
</html>
